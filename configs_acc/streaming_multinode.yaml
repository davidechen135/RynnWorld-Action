# ─────────────────────────────────────────────────────────────────────────────
# accelerate_config_multinode.yaml — MULTI-NODE accelerate config for
# streaming control distill v2 wrapper.
#
# Key differences from single-node accelerate_config.yaml:
# ──────────────────────────────────────────────────
# 1. num_machines / num_processes / machine_rank / main_process_ip /
#    main_process_port use ${ENV_VAR} placeholders, rendered by the wrapper
#    via envsubst (single-node hardcodes 1/8/0).
#
# 2. num_processes must equal TOTAL_GPUS (not NPROC_PER_NODE).
#    accelerate treats num_processes as TOTAL; nproc_per_node is derived as
#    num_processes / num_machines.  e.g. yaml & CLI both set 32.
#
# 3. deepspeed_multinode_launcher: standard
#    Uses standard launcher (torchrun-style, no PDSH/SSH).
#    accelerate launch.py:427-435 computes:
#      nproc_per_node = num_processes // num_machines  = 32/4 = 8
#      nnodes = num_machines = 4, node_rank = machine_rank
#
# 4. Aligned with teacher_model/configs_acc/multinode_deepspeed.yaml
#    (validated on 32-GPU SFT pretrain).
# ─────────────────────────────────────────────────────────────────────────────
compute_environment: LOCAL_MACHINE
debug: false
deepspeed_config:
  deepspeed_config_file: configs_zero/zero2_offload.yaml
  zero3_init_flag: false
  deepspeed_multinode_launcher: standard
distributed_type: DEEPSPEED
downcast_bf16: "no"
num_processes: ${TOTAL_GPUS}
num_machines: ${WORLD_SIZE}
machine_rank: ${RANK}
main_process_ip: ${MASTER_ADDR}
main_process_port: ${MASTER_PORT}
main_training_function: MAIN
rdzv_backend: static
same_network: true
tpu_env: []
tpu_use_cluster: false
tpu_use_sudo: false
use_cpu: false
